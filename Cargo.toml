[workspace]
members = [
    "crates/dsline-core",
    "crates/dsline-shm",
    "crates/dsline-transport",
    "crates/dsline-pipeline",
    "crates/dsline-ops",
    "crates/dsline-python",
]
resolver = "2"

[workspace.package]
description = "Lightweight local dataflow and shared-memory channel prototypes for Python."
edition = "2021"
license = "MIT"
rust-version = "1.75"
version = "0.0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
panic = "warn"
unwrap_used = "warn"
