name: CI

on:
  push:
  pull_request:

jobs:
  rust-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Rust tests
        run: cargo test

      - name: Install maturin
        run: python -m pip install "maturin>=1.5,<2"

      - name: Build wheel
        run: python -m maturin build --manifest-path crates/dsline-python/Cargo.toml --interpreter python

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install target/wheels/*.whl

      - name: Python tests
        run: python -m unittest discover -s tests/python

      - name: CLI smoke
        run: python -m dsline info --json
