name: CI

on:
  push:
  pull_request:

jobs:
  rust-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust fmt
        run: cargo fmt --all --check

      # The test steps turn their failures into `::error::` annotations: the
      # raw job log needs repository credentials, so without this a red run
      # reports only "exit code 101" to anyone outside the repository.
      # Three details matter: `shell: bash` runs the script with `-e` (hence
      # `set +e`), cargo colourises its output on a runner (hence the ANSI
      # strip), and GitHub keeps at most 10 annotations per step (hence the
      # ordering and the `head -10`).
      - name: Rust tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log
          status=$?
          if [ "$status" -ne 0 ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' cargo-test.log > clean.log
            {
              grep -E -- '---- .* stdout ----' clean.log
              grep -E -- 'error\[|^error:|panicked at' clean.log
              grep -E -- 'test result: FAILED' clean.log
            } | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: Install maturin
        run: python -m pip install "maturin>=1.5,<2"

      - name: Build wheel
        run: python -m maturin build --manifest-path crates/dsline-python/Cargo.toml --interpreter python

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install target/wheels/*.whl

      - name: Python tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m unittest discover -s tests/python 2>&1 | tee python-test.log
          status=$?
          if [ "$status" -ne 0 ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' python-test.log > clean.log
            {
              grep -E -- '^(FAIL|ERROR):' clean.log
              grep -E -- '(Error|Exception|_queue\.Empty)' clean.log
              grep -E -- '^Ran |^FAILED' clean.log
            } | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: CLI smoke
        run: python -m dsline info --json
