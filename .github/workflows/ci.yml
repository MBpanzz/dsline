name: CI

on:
  push:
  pull_request:

jobs:
  rust-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log
          status=$?
          if [ "$status" -ne 0 ]; then
            # Surface what failed as annotations: the raw job log needs
            # repository credentials, so a failure here is otherwise
            # undiagnosable from outside.
            grep -E '^---- .* stdout ----|^error(\[|:)|^test result: FAILED' cargo-test.log \
              | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: Install maturin
        run: python -m pip install "maturin>=1.5,<2"

      - name: Build wheel
        run: python -m maturin build --manifest-path crates/dsline-python/Cargo.toml --interpreter python

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install target/wheels/*.whl

      - name: Python tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests/python 2>&1 | tee python-test.log
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAIL|ERROR):|^Ran |^FAILED' python-test.log \
              | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: CLI smoke
        run: python -m dsline info --json
